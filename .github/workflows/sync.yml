name: Sync Container Images to ACR

on:
  schedule:
    # 每天北京时间 03:00 自动同步（UTC 前一天 19:00）
    - cron: '0 19 * * *'

  # 保留手动触发入口
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-hangzhou.aliyuncs.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo shellcheck

      - name: shellcheck
        run: shellcheck -x sync.sh

      - name: Validate images.txt
        run: bash sync.sh validate

      - name: Login to ACR
        run: skopeo login "$REGISTRY" -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"

      - name: Login to Docker Hub (if configured)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Authenticating to Docker Hub"
            skopeo login docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
          else
            echo "Docker Hub credentials not configured, pulling anonymously"
          fi

      - name: Sync images
        run: bash sync.sh
